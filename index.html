<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hehe — Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --bubble-me: linear-gradient(135deg, #7c5cff, #5b3fd6);
      --bubble-bot: #273449;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #312e81 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, #0e7490 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      background: #7c5cff;
      top: -120px;
      left: -100px;
      animation: float-a 9s ease-in-out infinite;
    }
    body::after {
      background: #22d3ee;
      bottom: -140px;
      right: -100px;
      animation: float-b 11s ease-in-out infinite;
    }

    @keyframes float-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.15); }
    }
    @keyframes float-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-35px, -25px) scale(1.1); }
    }

    .chat {
      width: min(720px, 100%);
      height: min(80vh, 720px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
      overflow: hidden;
      animation: chat-in .6s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes chat-in {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .title { font-weight: 700; font-size: 16px; }
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
      50% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }

    .row {
      display: flex;
      gap: 8px;
      max-width: 85%;
      animation: msg-in .35s cubic-bezier(.2,.9,.3,1.2) both;
    }
    .row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
      animation-name: msg-in-me;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateX(-16px) translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
    }
    @keyframes msg-in-me {
      from { opacity: 0; transform: translateX(16px) translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
    }

    .mini {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: var(--bubble-bot); color: var(--text);
    }
    .row.me .mini { background: var(--accent); color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      background: var(--bubble-bot);
      line-height: 1.45;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .row.me .bubble {
      background: var(--bubble-me);
      border-radius: 16px 16px 4px 16px;
      color: #fff;
    }

    .time { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .row.me .time { color: rgba(255,255,255,.7); text-align: right; }

    .typing { display: flex; gap: 4px; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      background: var(--panel-2);
      border-top: 1px solid rgba(255,255,255,.06);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.2); }
    input::placeholder { color: var(--muted); }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #5b3fd6);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .gear {
      margin-left: auto;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      font-size: 18px;
    }
    .gear:hover { background: rgba(255,255,255,.16); transform: none; }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,6,23,.72);
      z-index: 10;
    }
    .overlay.open { display: flex; animation: fade-in .2s ease both; }

    .modal {
      width: min(440px, 100%);
      padding: 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: var(--panel);
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      animation: chat-in .3s ease both;
    }
    .modal h2 { margin: 0 0 6px; font-size: 18px; }
    .modal p { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
    .field select, .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .field select:focus, .field input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .ghost { background: rgba(255,255,255,.08); }
    .ghost:hover { background: rgba(255,255,255,.16); transform: none; }
    .error { min-height: 16px; margin-top: 8px; font-size: 12px; color: #fca5a5; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .hint { text-align: center; font-size: 11px; color: var(--muted); padding: 8px; background: var(--panel-2); }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="avatar">h</div>
      <div>
        <div class="title">hehe chat</div>
        <div class="status"><span class="dot"></span> <span id="status-text">Online · demo bot</span></div>
      </div>
      <button class="gear" id="settings-btn" title="API settings" aria-label="API settings">⚙</button>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="Type a message..." maxlength="500" aria-label="Message" />
      <button type="submit">Send</button>
    </form>
    <div class="hint">Local demo · add an API key with ⚙ for AI replies · Press Enter to send</div>
  </div>

  <div class="overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-label="API settings">
    <div class="modal">
      <h2>API settings</h2>
      <p>Use any OpenAI-compatible API. Settings are saved only in this browser. Leave the key blank to use the local demo bot.</p>

      <div class="field">
        <label for="provider">Provider preset</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="openrouter">OpenRouter</option>
          <option value="groq">Groq</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field">
        <label for="base-url">Base URL</label>
        <input id="base-url" placeholder="https://api.openai.com/v1" autocomplete="off" />
      </div>
      <div class="field">
        <label for="api-key">API key</label>
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" placeholder="gpt-4o-mini" autocomplete="off" />
      </div>

      <div class="error" id="settings-error"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-btn">Cancel</button>
        <button type="button" id="save-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const statusText = document.getElementById('status-text');

    const PRESETS = {
      openai: { base: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
      openrouter: { base: 'https://openrouter.ai/api/v1', model: 'openai/gpt-4o-mini' },
      groq: { base: 'https://api.groq.com/openai/v1', model: 'llama-3.3-70b-versatile' },
      custom: { base: '', model: '' }
    };

    const settings = {
      provider: localStorage.getItem('hehe_provider') || 'openai',
      base: localStorage.getItem('hehe_base') || PRESETS.openai.base,
      key: localStorage.getItem('hehe_key') || '',
      model: localStorage.getItem('hehe_model') || PRESETS.openai.model
    };

    function updateStatus() {
      statusText.textContent = settings.key
        ? 'AI connected · ' + settings.model
        : 'Online · demo bot';
    }
    updateStatus();

    const overlay = document.getElementById('settings-overlay');
    const providerEl = document.getElementById('provider');
    const baseEl = document.getElementById('base-url');
    const keyEl = document.getElementById('api-key');
    const modelEl = document.getElementById('model');
    const settingsError = document.getElementById('settings-error');

    function openSettings() {
      providerEl.value = settings.provider;
      baseEl.value = settings.base;
      keyEl.value = settings.key;
      modelEl.value = settings.model;
      settingsError.textContent = '';
      overlay.classList.add('open');
      providerEl.focus();
    }

    function closeSettings() {
      overlay.classList.remove('open');
    }

    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.getElementById('cancel-btn').addEventListener('click', closeSettings);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSettings(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

    providerEl.addEventListener('change', () => {
      const preset = PRESETS[providerEl.value];
      baseEl.value = preset.base;
      modelEl.value = preset.model;
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const base = baseEl.value.trim();
      const key = keyEl.value.trim();
      const model = modelEl.value.trim();

      if (key && (!base || !model)) {
        settingsError.textContent = 'Base URL and model are required when using an API key.';
        return;
      }

      settings.provider = providerEl.value;
      settings.base = base;
      settings.key = key;
      settings.model = model;

      localStorage.setItem('hehe_provider', settings.provider);
      localStorage.setItem('hehe_base', settings.base);
      localStorage.setItem('hehe_key', settings.key);
      localStorage.setItem('hehe_model', settings.model);

      updateStatus();
      closeSettings();
    });

    const history = [];

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, who) {
      const row = document.createElement('div');
      row.className = 'row ' + (who === 'me' ? 'me' : 'bot');

      const mini = document.createElement('div');
      mini.className = 'mini';
      mini.textContent = who === 'me' ? 'You' : 'h';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = (who === 'me' ? 'You' : 'hehe bot') + ' · ' + timeNow();
      bubble.appendChild(time);

      row.append(mini, bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      history.push({ role: who === 'me' ? 'user' : 'assistant', text: text });
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typing-row';
      row.innerHTML = '<div class="mini">h</div><div class="bubble typing"><span></span><span></span><span></span></div>';
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typing-row')?.remove();
    }

    const replies = [
      'hehe! 😄 tell me more',
      'That is actually pretty cool.',
      'Hmm, interesting — what made you think of that?',
      'I am just a little demo bot, but I am all ears 👂',
      'lol hehe 💜',
      'Try saying "hi", "help", or "joke"!',
      'You got it! ✅',
      'Nice one. What else is on your mind?'
    ];

    function botReply(text) {
      const t = text.toLowerCase();
      if (/^(hi|hello|hey|yo)\b/.test(t)) return 'Hey there! 👋 hehe nice to meet you.';
      if (t.includes('how are you')) return 'I am great, thanks for asking! hehe 😄';
      if (t.includes('name')) return 'I am hehe bot, your tiny chat buddy.';
      if (t.includes('joke')) return 'Why did the news reporter get fired? Because they were always on the scene! 📰😄';
      if (t.includes('help')) return 'Just type anything and I will reply. Commands: hi, joke, name, time.';
      if (t.includes('time')) return 'It is ' + timeNow() + ' right now. ⏰';
      if (t.includes('bye')) return 'Bye! Come back and chat again soon 👋';
      return replies[Math.floor(Math.random() * replies.length)];
    }

    async function aiReply(text) {
      const response = await fetch(settings.base.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + settings.key
        },
        body: JSON.stringify({
          model: settings.model,
          messages: [
            { role: 'system', content: 'You are hehe, a friendly and playful chat companion. Keep replies short, warm and conversational.' },
            ...history.slice(-11, -1).map(m => ({ role: m.role, content: m.text })),
            { role: 'user', content: text }
          ],
          temperature: 0.8,
          max_tokens: 300
        })
      });

      if (!response.ok) {
        let detail = '';
        try { detail = (await response.json()).error?.message || ''; } catch (_) {}
        throw new Error('API ' + response.status + (detail ? ': ' + detail : ''));
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content;
      if (!reply) throw new Error('Empty reply from API');
      return reply.trim();
    }

    addMessage('Hey! Welcome to hehe chat 😄 Type something to start talking.', 'bot');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'me');
      input.value = '';
      input.focus();
      showTyping();

      try {
        let reply;
        if (settings.key) {
          reply = await aiReply(text);
        } else {
          await new Promise(r => setTimeout(r, 450 + Math.random() * 700));
          reply = botReply(text);
        }
        hideTyping();
        addMessage(reply, 'bot');
      } catch (err) {
        hideTyping();
        addMessage('API error: ' + err.message + '\n\nLocal fallback: ' + botReply(text), 'bot');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oasis Ai — Relationship Adviser</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --bubble-me: linear-gradient(135deg, #7c5cff, #5b3fd6);
      --bubble-bot: #273449;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #312e81 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, #0e7490 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      background: #7c5cff;
      top: -120px;
      left: -100px;
      animation: float-a 9s ease-in-out infinite;
    }
    body::after {
      background: #22d3ee;
      bottom: -140px;
      right: -100px;
      animation: float-b 11s ease-in-out infinite;
    }

    @keyframes float-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.15); }
    }
    @keyframes float-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-35px, -25px) scale(1.1); }
    }

    .chat {
      width: min(720px, 100%);
      height: min(80vh, 720px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
      overflow: hidden;
      animation: chat-in .6s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes chat-in {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .title { font-weight: 700; font-size: 16px; }
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
      50% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }

    .row {
      display: flex;
      gap: 8px;
      max-width: 85%;
      animation: msg-in .35s cubic-bezier(.2,.9,.3,1.2) both;
    }
    .row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
      animation-name: msg-in-me;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateX(-16px) translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
    }
    @keyframes msg-in-me {
      from { opacity: 0; transform: translateX(16px) translateY(6px) scale(.96); }
      to { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
    }

    .mini {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: var(--bubble-bot); color: var(--text);
    }
    .row.me .mini { background: var(--accent); color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      background: var(--bubble-bot);
      line-height: 1.45;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .row.me .bubble {
      background: var(--bubble-me);
      border-radius: 16px 16px 4px 16px;
      color: #fff;
    }

    .time { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .row.me .time { color: rgba(255,255,255,.7); text-align: right; }

    .typing { display: flex; gap: 4px; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      background: var(--panel-2);
      border-top: 1px solid rgba(255,255,255,.06);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.2); }
    input::placeholder { color: var(--muted); }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #5b3fd6);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 18px 0;
      background: var(--panel-2);
    }
    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }
    .chip:hover { background: rgba(255,255,255,.16); transform: none; }

    .gear {
      margin-left: auto;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      font-size: 18px;
    }
    .gear:hover { background: rgba(255,255,255,.16); transform: none; }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,6,23,.72);
      z-index: 10;
    }
    .overlay.open { display: flex; animation: fade-in .2s ease both; }

    .modal {
      width: min(440px, 100%);
      padding: 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: var(--panel);
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      animation: chat-in .3s ease both;
    }
    .modal h2 { margin: 0 0 6px; font-size: 18px; }
    .modal p { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
    .field select, .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .field select:focus, .field input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .ghost { background: rgba(255,255,255,.08); }
    .ghost:hover { background: rgba(255,255,255,.16); transform: none; }
    .error { min-height: 16px; margin-top: 8px; font-size: 12px; color: #fca5a5; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .hint { text-align: center; font-size: 11px; color: var(--muted); padding: 8px; background: var(--panel-2); }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="avatar">O</div>
      <div>
        <div class="title">Oasis Ai</div>
        <div class="status"><span class="dot"></span> <span id="status-text">Online · relationship adviser</span></div>
      </div>
      <button class="gear" id="settings-btn" title="API settings" aria-label="API settings">⚙</button>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="quick">
      <button type="button" class="chip" data-text="I want to get back with my ex">I want them back</button>
      <button type="button" class="chip" data-text="I want to move on">I want to move on</button>
      <button type="button" class="chip" data-text="I'm not sure what to do">I'm not sure</button>
    </div>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="Tell me what happened..." maxlength="500" aria-label="Message" />
      <button type="submit">Send</button>
    </form>
    <div class="hint">Relationship advice · add an API key with ⚙ for AI replies · Press Enter to send</div>
  </div>

  <div class="overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-label="API settings">
    <div class="modal">
      <h2>API settings</h2>
      <p>Use any OpenAI-compatible API. Settings are saved only in this browser. Leave the key blank to use the local demo bot.</p>

      <div class="field">
        <label for="provider">Provider preset</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="openrouter">OpenRouter</option>
          <option value="groq">Groq</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field">
        <label for="base-url">Base URL</label>
        <input id="base-url" placeholder="https://api.openai.com/v1" autocomplete="off" />
      </div>
      <div class="field">
        <label for="api-key">API key</label>
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" placeholder="gpt-4o-mini" autocomplete="off" />
      </div>

      <div class="error" id="settings-error"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-btn">Cancel</button>
        <button type="button" id="save-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const statusText = document.getElementById('status-text');

    const PRESETS = {
      openai: { base: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
      openrouter: { base: 'https://openrouter.ai/api/v1', model: 'openai/gpt-4o-mini' },
      groq: { base: 'https://api.groq.com/openai/v1', model: 'llama-3.3-70b-versatile' },
      custom: { base: '', model: '' }
    };

    const saved = (name, fallback) =>
      localStorage.getItem('oasis_' + name) || localStorage.getItem('hehe_' + name) || fallback;

    const settings = {
      provider: saved('provider', 'openai'),
      base: saved('base', PRESETS.openai.base),
      key: saved('key', ''),
      model: saved('model', PRESETS.openai.model)
    };

    function updateStatus() {
      statusText.textContent = settings.key
        ? 'AI connected · ' + settings.model
        : 'Online · relationship adviser';
    }
    updateStatus();

    const overlay = document.getElementById('settings-overlay');
    const providerEl = document.getElementById('provider');
    const baseEl = document.getElementById('base-url');
    const keyEl = document.getElementById('api-key');
    const modelEl = document.getElementById('model');
    const settingsError = document.getElementById('settings-error');

    function openSettings() {
      providerEl.value = settings.provider;
      baseEl.value = settings.base;
      keyEl.value = settings.key;
      modelEl.value = settings.model;
      settingsError.textContent = '';
      overlay.classList.add('open');
      providerEl.focus();
    }

    function closeSettings() {
      overlay.classList.remove('open');
    }

    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.getElementById('cancel-btn').addEventListener('click', closeSettings);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSettings(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

    providerEl.addEventListener('change', () => {
      const preset = PRESETS[providerEl.value];
      baseEl.value = preset.base;
      modelEl.value = preset.model;
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const base = baseEl.value.trim();
      const key = keyEl.value.trim();
      const model = modelEl.value.trim();

      if (key && (!base || !model)) {
        settingsError.textContent = 'Base URL and model are required when using an API key.';
        return;
      }

      settings.provider = providerEl.value;
      settings.base = base;
      settings.key = key;
      settings.model = model;

      localStorage.setItem('oasis_provider', settings.provider);
      localStorage.setItem('oasis_base', settings.base);
      localStorage.setItem('oasis_key', settings.key);
      localStorage.setItem('oasis_model', settings.model);

      updateStatus();
      closeSettings();
    });

    const history = [];

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, who) {
      const row = document.createElement('div');
      row.className = 'row ' + (who === 'me' ? 'me' : 'bot');

      const mini = document.createElement('div');
      mini.className = 'mini';
      mini.textContent = who === 'me' ? 'You' : 'O';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = (who === 'me' ? 'You' : 'Oasis Ai') + ' · ' + timeNow();
      bubble.appendChild(time);

      row.append(mini, bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      history.push({ role: who === 'me' ? 'user' : 'assistant', text: text });
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typing-row';
      row.innerHTML = '<div class="mini">O</div><div class="bubble typing"><span></span><span></span><span></span></div>';
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typing-row')?.remove();
    }

    const advice = {
      getBack: [
        'If you want them back, start with honest reflection: what went wrong, and what you would genuinely change. Then give them space and reach out once with a calm, respectful message — no guilt, no chasing.',
        'Wanting them back is human, but your best chance is to heal first. Own your part, apologize clearly if you need to, and let consistency — not pressure — do the talking. Respect whatever they decide.',
        'Before trying to win them back, ask yourself if you miss the person or the feeling. If it is the person, give them room, invite one honest conversation, and accept their answer gracefully.'
      ],
      moveOn: [
        'Moving on starts with boundaries: mute or limit their socials, stop rereading old messages, and give yourself real space. Fill that time with routine, friends, and something that reminds you who you are.',
        'It is okay to grieve — do not rush it. Let yourself feel it, then gently put energy into sleep, movement, and people who show up for you. If it feels too heavy, talking to a counselor can really help.',
        'To move forward, make one small plan for each day this week instead of trying to forget them all at once. Progress is choosing yourself a little more each day, not flipping a switch.'
      ],
      unsure: [
        'Tell me a bit more: do you want to win them back, or are you trying to move on? What happened between you two?',
        'I can help either way. Are you hoping to get back together, or trying to let go? Share a little about the situation and I will give you practical, judgment-free advice.',
        'Let us start with where you are right now. Do you want another chance with them, or do you want help moving forward?'
      ]
    };

    function detectIntent(text) {
      const t = text.toLowerCase();
      const back = /get (back|them back|her back|him back)|get back together|win (them|her|him) back|reconcile|come back|second chance|still love|still care|miss (them|her|him)|want (them|her|him) back|fix (it|things|us)|make (it|things|us) right|apolog|why they left/i.test(t);
      const move = /move on|let go|forget (them|her|him)|get over|broke up|breakup|ended (it|things|us)|no contact|stop thinking|healing|over (them|her|him)|moving forward|better off/i.test(t);
      if (back && move) return 'unsure';
      if (back) return 'getBack';
      if (move) return 'moveOn';
      return 'unsure';
    }

    function botReply(text) {
      const t = text.toLowerCase();
      if (/^(hi|hello|hey|yo)\b/.test(t)) return "Hey, I'm Oasis Ai, your relationship adviser 💜 Tell me what happened — do you want to get back together or move on?";
      if (t.includes('how are you')) return "I'm here and ready to listen. What's going on with you and them?";
      if (t.includes('name')) return "I'm Oasis Ai, a relationship adviser here to help you figure out your next step.";
      if (t.includes('help')) return "Tell me: are you trying to get back with someone, or trying to move on? Share what happened and I'll give you honest, judgment-free advice.";
      if (t.includes('time')) return 'It is ' + timeNow() + ' right now. 💜';
      if (t.includes('bye')) return 'Take care of yourself. Come back anytime you want to talk 💜';

      const pool = advice[detectIntent(text)];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    async function aiReply(text) {
      const response = await fetch(settings.base.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + settings.key
        },
        body: JSON.stringify({
          model: settings.model,
          messages: [
            {
              role: 'system',
              content: [
                'You are Oasis Ai, a warm, practical relationship adviser.',
                'First, infer from the user message whether they want to (a) get back together with an ex or partner, (b) move on, or (c) are unsure.',
                'If they want to get back: encourage honest self-reflection, taking responsibility, giving the other person space, one respectful conversation, and accepting their decision. Never suggest manipulation, guilt-tripping, stalking, monitoring, or ignoring boundaries.',
                'If they want to move on: validate their feelings, suggest no-contact or reduced contact, self-care routines, support from friends, and professional help when needed. Avoid toxic positivity.',
                'If unsure: ask one or two short clarifying questions about what happened and what they want.',
                'Use the user wording (her, him, them) when they provide it. Keep replies short (2-5 sentences), compassionate, and actionable. Do not claim to be a licensed therapist; suggest professional support for serious distress.'
              ].join(' ')
            },
            ...history.slice(-11, -1).map(m => ({ role: m.role, content: m.text })),
            { role: 'user', content: text }
          ],
          temperature: 0.7,
          max_tokens: 250
        })
      });

      if (!response.ok) {
        let detail = '';
        try { detail = (await response.json()).error?.message || ''; } catch (_) {}
        throw new Error('API ' + response.status + (detail ? ': ' + detail : ''));
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content;
      if (!reply) throw new Error('Empty reply from API');
      return reply.trim();
    }

    addMessage("Hi, I'm Oasis Ai 💜 Your relationship adviser. Tell me what happened — do you want to get back together or move on? I'll give you honest, judgment-free advice.", 'bot');

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        input.value = chip.dataset.text;
        form.requestSubmit();
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'me');
      input.value = '';
      input.focus();
      showTyping();

      try {
        let reply;
        if (settings.key) {
          reply = await aiReply(text);
        } else {
          await new Promise(r => setTimeout(r, 450 + Math.random() * 700));
          reply = botReply(text);
        }
        hideTyping();
        addMessage(reply, 'bot');
      } catch (err) {
        hideTyping();
        addMessage('API error: ' + err.message + '\n\nLocal fallback: ' + botReply(text), 'bot');
      }
    });
  </script>
</body>
</html>
